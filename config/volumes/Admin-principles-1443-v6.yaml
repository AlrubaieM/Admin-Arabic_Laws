# Reader calibration (master prompt section 5, TEXT LAYER PROTOCOL).
# Repairs are keyed by glyph id of the base font; subsets of one font share glyph ids.
# Every repair below was established from a 600 dpi crop of a rendered occurrence
# read by the reviewer on 03/11/2026 (work/calibration/<volume_id>/crops).
reader:
  space_gap_ratio: 0.3
  baseline_tolerance_ratio: 0.25
  # Digit groups are read right to left as separate numbers, each in its own reading order
  # ("(ب/1752/1443)" prints 1752 beside the letter; "(أ/2771-2893/1442)" prints 2771 beside the slash).
  digit_run_joiners: []
  # The cataloging page prints Latin-style number strings left to right as a whole (ISBN "978-603-8286-63-0").
  page_overrides:
    - pages: [2]
      digit_run_joiners: ["-"]
      reason: "ISBN on the cataloging page is one left-to-right string (crop p2 'ردمك')"
  hamza_x_tolerance: 0.6
  head_tail_tolerance: 0.8

fonts:
  - name: "AXtManal"
    role: "body"
    text_layer: "defective"
    glyph_repairs:
      42: {text: "ا", role: "alef_body", basis: "alef glyph used as the body of hamza letters (crop p8 'أتعاب')"}
      176: {text: "لا", role: "lam_alef", basis: "lam-alef ligature mapped to a bare lam (crops p8 'ولاية', 'الإدارية')"}
      54: {text: "س", role: "head", basis: "head of seen, initial/medial form (crop p9 'سائر')"}
      122: {text: "س", role: "head", basis: "head of seen, second form (crop p8 'السير')"}
      55: {text: "ش", role: "head", basis: "head of sheen (crop p9 'ناشئة')"}
      123: {text: "ش", role: "head", basis: "head of sheen, second form (crop p8 'لشخصية')"}
      56: {text: "ص", role: "head", basis: "head of sad (crop p7 'اختصاص')"}
      124: {text: "ص", role: "head", basis: "head of sad, second form (crop p7 'اختصاص')"}
      57: {text: "ض", role: "head", basis: "head of dad (crop p7 'الأراضي')"}
      166: {text: "ض", role: "head", basis: "head of dad, second form (crop p7 'القضية')"}
      126: {text: "", role: "tail", basis: "shared tail glyph of seen/sheen/sad/dad; the letter is carried by the head glyph"}
      127: {text: "", role: "tail", basis: "shared tail glyph of seen/sheen/sad/dad; the letter is carried by the head glyph"}
  - name: "AXtManalBold"
    role: "heading"
    text_layer: "defective"
    glyph_repairs:
      42: {text: "ا", role: "alef_body", basis: "as AXtManal (CMap of the index subset maps it to U+FFFD)"}
      176: {text: "لا", role: "lam_alef", basis: "as AXtManal (crop p2 'الإدارية')"}
      54: {text: "س", role: "head", basis: "crop p12 'المؤسسة'"}
      122: {text: "س", role: "head", basis: "crop p2 'السادس'"}
      55: {text: "ش", role: "head", basis: "as AXtManal"}
      123: {text: "ش", role: "head", basis: "as AXtManal"}
      56: {text: "ص", role: "head", basis: "crop p9 'اختصاص'"}
      124: {text: "ص", role: "head", basis: "crop p9 'اختصاص'"}
      57: {text: "ض", role: "head", basis: "crop p15 'الأراضي'"}
      166: {text: "ض", role: "head", basis: "crop p8 'القضية'"}
      126: {text: "", role: "tail", basis: "as AXtManal"}
      127: {text: "", role: "tail", basis: "as AXtManal"}
      # glyphs used only by the cataloging page's symbol-encoded subset
