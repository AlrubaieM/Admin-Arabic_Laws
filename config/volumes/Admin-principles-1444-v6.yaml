# Volume configuration: identity, source files, reader calibration, and decisions.
# Read by scripts/pipeline.py; nothing volume-specific is hard-coded in the scripts.
volume_id: "Admin-principles-1444-v6"
collection_name_ar: "مجموعة المبادئ التي قررتها المحكمة الإدارية العليا"
collection_name_en: "Principles Decided by the Supreme Administrative Court"
collection_name_en_basis: "descriptive"
volume_ordinal_ar: "المجلد السادس"
volume_number: "6"
year_hijri: "1444"
publisher_ar: "ديوان المظالم"
publisher_en: "Board of Grievances"
publisher_en_basis: "descriptive"
publisher_unit_ar: "مكتب الشؤون الفنية"
publisher_unit_basis: "cover image read by the reviewer on 06/11/2026; the cover carries no text layer"
folder_name: "Admin-principles-1444-v6"
name_source_location: "page[2]:L2-L4 (cataloging block; the cover title is an image)"
identity_basis: "cataloging_page"

# Cataloging block of page[2], as printed (reader output of 06/11/2026). The deposit number is read as the
# page prints it right to left (9634 beside the colon, then 1447), the same convention as the ruling references.
cataloging:
  deposit_number: "9634/1447"
  isbn: "978-603-8286-79-1"
  extent_ar: "151 ص ؛ ..سم"

# Cover text lines, read by the reviewer from the cover image on 06/11/2026 (the cover has no text layer).
cover_lines_ar:
  - "المملكة العربية السعودية"
  - "ديوان المظالم"
  - "مكتب الشؤون الفنية"
  - "مجموعة المبادئ"
  - "التي قررتها المحكمة الإدارية العليا"
  - "لعام 1444هـ"
  - "المجلد السادس"

# Reading questions the reviewer could not settle from the page (open review items until decided).
reading_questions:
  - location: "page[2]:r2:c0:L0"
    observed: "رقم الإيداع : 9634/1447"
    note: "the deposit number prints 1447 left and 9634 right (nearest the colon); the vault reads the groups right to left like the ruling references (9634/1447); the serial/year order the library intends is not stated on the page"
    options: ["keep 9634/1447 (as read right to left)", "decision: read as one left-to-right string 1447/9634"]

# Pages without a text layer take their class from this declaration (master prompt section 5, PAGE CLASSES).
page_classes:
  "1": "cover"
  "3": "basmala"
  "4": "half_title"
  "5": "divider"
  "6": "half_title"

# The full index volume supplied by the user on 06/11/2026 replaces the 13-page extracts (the original export,
# SHA-256 c7aaace1…ce33c9, and its Print To PDF copy, 772ed079…03a8c, kept as test fixtures in tests/fixtures/samples/pdfs/).
source_files:
  - original_name: "Indexes-مجموعة مبادئ و قرارات المحكمة الادارية العليا أعوام 1444.pdf"
    path: "مجموعة مبادئ وقرارات المحكمة الادارية العليا/مجموعة أعوام 1444/Indexes-مجموعة مبادئ و قرارات المحكمة الادارية العليا أعوام 1444.pdf"
    sha256: "3ca8e7269d12418bae3334be3b23ee71eecddd2ea2642835b2286d7ca05a128b"
    kind: "index"
    rank: 1
    page_label_offset: 4

# Reader calibration (master prompt section 5, TEXT LAYER PROTOCOL).
# The fonts are the AXtManal family of the 1443 volume. The reader identifies each font by byte-identical glyph
# outlines in the other verified sources of the vault (pdf_source.discover_references, reported in work/records and
# the build report) and takes the text and glyph repairs established there; repairs listed here would override them.
reader:
  space_gap_ratio: 0.3
  baseline_tolerance_ratio: 0.25
  digit_run_joiners: []
  page_overrides:
    - pages: [2]
      digit_run_joiners: ["-"]
      reason: "ISBN on the cataloging page is one left-to-right string"
  hamza_x_tolerance: 0.6
  head_tail_tolerance: 0.8
  reference_fonts: true

fonts:
  - {name: "AXtManal", role: "body", text_layer: "defective"}
  - name: "AXtManalBold"
    role: "heading"
    text_layer: "defective"
    glyph_repairs:
      85: {text: "ِّ", role: "mark", basis: "zero-width kasra-with-shadda mark whose ToUnicode entry adds a spurious «ر»; the page draws «المُغيِّر» with one «ر» (crop page[100]:r6 title, 06/11/2026)"}
  - {name: "HacenTunisiaLt", role: "other", text_layer: "reliable"}
  - {name: "MinionPro-Regular", role: "digits", text_layer: "reliable"}
  - name: "DecoType-ProfessionalNaskhSupplement5Phrases"
    role: "other"
    text_layer: "defective"
    glyph_repairs:
      119: {text: "صلى الله عليه وسلم", role: "letter", basis: "phrase glyph of the honorific (U+FDFA) drawn after «لرسول»; crop p148 (06/11/2026)"}

# Titles of the volume's other indexes, printed as banner images (read by the reviewer on 06/11/2026).
table_index_titles:
  rulings: "فهرس الأحكام"
  instruments: "فهرس مستند الحكم"

ruling_reference_components: null  # meaning of (prefix letter / number / year) not asserted

body_sections: {}  # established on the first principle file (Appendix B); none supplied yet

source_anomalies: []

decisions: {}
