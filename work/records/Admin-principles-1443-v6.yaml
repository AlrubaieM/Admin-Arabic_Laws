  title_ar: "ولاية المحاكم الإدارية حيال أتعاب المحاماة"
  title_basis: "subtopic_line"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "أتعاب محاماة"
    subtopic_label: "أولاً/"
    subtopic_title: "ولاية المحاكم الإدارية حيال أتعاب المحاماة"
  paragraphs:
  - "إذا كان النزاع متعلق بأتعاب محاماة، وكانت المحكمة التي نظرت في القضية محل عقد المحاماة هي المحكمة الإدارية؛ فتكون تلك المحكمة هي المختصة بنظر النزاع، ولا أثر لشخصية الطرفين في تقرير الاختصاص وتحديده."
  wrap_joins:
  - "page[8]:r2:c0:L2 joined to previous line"
  - "page[8]:r2:c0:L3 joined to previous line"
  continues_block: null
- loc: "page[8]:r3"
  kind: "entry"
