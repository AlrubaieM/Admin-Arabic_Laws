  title_ar: "عدم مخالفة المصلحة العامة في الاختصاص المكاني"
  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "اختصاص"
    subtopic_label: "ثالثاً/"
    subtopic_title: "الاختصاص المكاني"
  paragraphs:
  - "قضاء حكم الاستئناف بإلغاء الحكم الابتدائي في موضوع الدعوى لمخالفته قواعد الاختصاص المكاني، لا يتفق مع المصلحة العامة؛ لما يترتب عليه من إعادة نظر الدعوى من جديد، وإطالة أمد النزاع، وتكرار إجراءات نظرها دون ضرورة حتمية."
  wrap_joins:
  - "page[15]:r4:c0:L2 joined to previous line"
  - "page[15]:r4:c0:L3 joined to previous line"
  - "page[15]:r4:c0:L4 joined to previous line"
  continues_block: null
