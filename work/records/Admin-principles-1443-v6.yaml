- loc: "page[14]:r1:c0:L1"
  class: "title"
  text: "الاستثناء منه:"
  bold: 1.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r1:c0:L2"
  class: "index_wording"
  text: "قواعد الاختصاص المكاني في القضاء الإداري تعد كأصل عام من النظام"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r1:c0:L3"
  class: "index_wording"
  text: "العام الذي لا يجوز الاتفاق على خلافه، إلا أن هذا الأصل يجري عليه"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r1:c0:L4"
  class: "index_wording"
  text: "استثناءات تقتضيها المصلحة العامة، وظروف الدعوى وما يحيط بها من"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r1:c0:L5"
