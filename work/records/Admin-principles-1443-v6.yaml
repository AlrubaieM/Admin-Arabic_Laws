  title_ar: "المختص بإصدار قرار تمليك الأراضي البور"
  title_basis: "subtopic_line"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "الأراضي البور"
    subtopic_label: "أولاً/"
    subtopic_title: "المختص بإصدار قرار تمليك الأراضي البور"
  paragraphs:
  - "المختص بإصدار قرار تمليك الأراضي البور لمن صدر لصالحهم قرار التخصيص باستثمارها هو وزير الزراعة لا لجنة النظر في المنازعات الناشئة عن تطبيق أحكام نظام توزيع الأراضي البور، ويتوقف نفاذ قرار الوزير بالتمليك على مصادقة الملك أو من يفوضه."
  wrap_joins:
  - "page[15]:r6:c0:L2 joined to previous line"
  - "page[15]:r6:c0:L3 joined to previous line"
  - "page[15]:r6:c0:L4 joined to previous line"
  continues_block: null
- loc: "page[16]:r1"
  kind: "entry"
  numbers:
  - "83"
  labels:
  - "361"
  references:
  - "(أ/1001/1442)"
  title_ar: "شرط توزيع الأراضي البور بين أفراد قبيلتين متنازعتين"
  title_basis: "subtopic_line"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "الأراضي البور"
    subtopic_label: "ثانياً/"
    subtopic_title: "شرط توزيع الأراضي البور بين أفراد قبيلتين متنازعتين"
  paragraphs:
  - "صدور أمر سامٍ بتوجيه وزارة الداخلية لوضع حد فاصل بين قبيلة (د) أهالي بلدة (ب)، وقبيلة (ق) أهالي بلدة (خ)، وتوجيه وزارة الزراعة لتخطيط المنطقة والتوزيع على أفراد القبيلتين كل في القسم الخاص به - تقرير المحكمة الإدارية العليا بأن الأمر السامي لم يحدد أشخاصاً بذواتهم للتوزيع عليهم، وإنما ورد عاماً للقبيلتين؛ ومن ثم فلا يمكن التوزيع إلا وفق آلية متبعة أهمها بيان أسماء المراد التوزيع عليهم، وهذا لا يتأتى إلا بمراجعة وزارة الزراعة ومطالبتها بالتوزيع من قبل أصحاب الشأن."
  wrap_joins:
  - "page[16]:r1:c0:L2 joined to previous line"
  - "page[16]:r1:c0:L3 joined to previous line"
  - "page[16]:r1:c0:L4 joined to previous line"
  - "page[16]:r1:c0:L5 joined to previous line"
  - "page[16]:r1:c0:L6 joined to previous line"
  - "page[16]:r1:c0:L7 joined to previous line"
  continues_block: null
