    letter_label: "حرف (أ)"
    topic: "اختصاص"
    subtopic_label: "ثالثاً/"
    subtopic_title: "الاختصاص المكاني"
  paragraphs:
  - "القدر الكافي لتعلق الدعوى بفرع الجهة الإدارية هو أن يتصل النزاع بأدنى صلاحية منوطة به لتمثيل الجهة الإدارية الأم في المنطقة."
  wrap_joins:
  - "page[15]:r1:c0:L1 joined to previous line"
  continues_block: 39
- loc: "page[15]:r2"
  kind: "entry"
  numbers:
