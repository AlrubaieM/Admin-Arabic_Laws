  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "اختصاص"
    subtopic_label: "ثالثاً/"
    subtopic_title: "الاختصاص المكاني"
  paragraphs:
  - "إذا تعدد مكان تنفيذ العقد في أكثر من منطقة، وانعقد الاختصاص المكاني لأكثر من محكمة تبعاً لذلك؛ فإنه يجب توحيد نظر النزاع أمام محكمة واحدة، ولو خالف ذلك قواعد الاختصاص المكاني؛ لئلا يتجزأ نظر النزاع في موضوع واحد، وينشأ عنه تعارض في الأحكام."
  wrap_joins:
  - "page[14]:r3:c0:L2 joined to previous line"
  - "page[14]:r3:c0:L3 joined to previous line"
  - "page[14]:r3:c0:L4 joined to previous line"
  continues_block: null
- loc: "page[14]:r4"
  kind: "entry"
  numbers:
  - "39"
  labels:
  - "156"
  references:
  - "(ج/1817/1442)"
  title_ar: "انعقاد الاختصاص المكاني حال تعدد مكان تنفيذ العقد ولم تتوفر المستندات في فروع المدعى عليه"
  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "اختصاص"
    subtopic_label: "ثالثاً/"
    subtopic_title: "الاختصاص المكاني"
  paragraphs:
  - "كون العقد ينفذ في أكثر من منطقة ولا يتعلق بفرع دون آخر، ولا تتوفر لدى هذه الفروع المستندات المتعلقة بالعقد في كل أجزائه؛ فإن المحكمة المختصة مكانياً بنظر منازعات العقد هي التي يقع في دائرة اختصاصها مقر المدعى عليه، ولو لم يتم تنفيذ العقد في دائرة اختصاصها."
  wrap_joins:
  - "page[14]:r4:c0:L3 joined to previous line"
  - "page[14]:r4:c0:L4 joined to previous line"
  - "page[14]:r4:c0:L5 joined to previous line"
  continues_block: null
- loc: "page[14]:r5"
  kind: "entry"
  numbers:
  - "96"
  labels:
  - "421"
  references:
  - "(أ/3019/1442)"
  title_ar: "القدر الكافي لتعلق الدعوى بفرع الجهة الإدارية"
  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "اختصاص"
    subtopic_label: "ثالثاً/"
    subtopic_title: "الاختصاص المكاني"
  paragraphs:
  - "مقتضى النظام أن الاختصاص المكاني يكون لمقر فرع الجهة المدعى عليها إن كانت الدعوى متعلقة به، وهذا التعلق غير مشروط بوصفٍ معينٍ، وإنما يتحقق إذا ثبت للفرع أدنى الصلاحيات لتمثيل المركز الرئيس في المنطقة."
  wrap_joins:
  - "page[14]:r5:c0:L2 joined to previous line"
  - "page[14]:r5:c0:L3 joined to previous line"
  continues_block: null
- loc: "page[15]:r1"
  kind: "continuation"
  numbers:
  - "120"
  labels:
  - "549"
  references:
  - "(ب/1424/1442)"
  title_ar: "القدر الكافي لتعلق الدعوى بفرع الجهة الإدارية"
  title_basis: "bullet_title"
  hierarchy:
