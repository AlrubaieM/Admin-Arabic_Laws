  references:
  - "(أ/2473/1442)"
  title_ar: "عدم مخالفة قرار المحكمة الإدارية العليا في الاختصاص المكاني"
  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "اختصاص"
    subtopic_label: "ثالثاً/"
    subtopic_title: "الاختصاص المكاني"
  paragraphs:
  - "إذا أصدرت المحكمة الإدارية العليا قرارها بتحديد المحكمة المختصة مكانياً بنظر الدعوى؛ فإنه لا يجوز لمحكمة الاستئناف مخالفته أو التعقيب عليه."
  wrap_joins:
  - "page[15]:r3:c0:L2 joined to previous line"
  continues_block: null
- loc: "page[15]:r4"
  kind: "entry"
