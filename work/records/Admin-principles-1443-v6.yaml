- loc: "page[14]:r2:c0:L0"
  class: "title"
  text: "• مناط الخروج عن القواعد المنظمة للاختصاص المكاني:"
  bold: 0.97
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r2:c0:L1"
  class: "index_wording"
  text: "إذا كانت المصلحة العامة في تقرير قواعد للاختصاص المكاني؛ فإنه يقابلها"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r2:c0:L2"
  class: "index_wording"
  text: "المصلحة العامة التي توجب إنهاء النزاعات، والفصل في الدعاوى في آجال"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r2:c0:L3"
  class: "index_wording"
  text: "معقولة، ومراعاة الاقتصاد في الخصومة، وتفادي تكرار عمل الإجراءات"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r2:c0:L4"
  class: "index_wording"
  text: "القضائية إلا لضرورة حتمية. ولذلك فإن وجود هذه المصلحة قد يبرر"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r2:c0:L5"
  class: "index_wording"
  text: "الخروج عن قواعد الاختصاص المكاني في حال تحققها. (ب/2678/1442)"
  bold: 0.0
  gap_spaces: 0
