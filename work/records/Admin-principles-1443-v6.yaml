- loc: "page[8]:r2:c0:L0"
  class: "subtopic_opener"
  text: "أولاً/ ولاية المحاكم الإدارية حيال أتعاب المحاماة:"
  bold: 1.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r2:c0:L1"
  class: "index_wording"
  text: "إذا كان النزاع متعلق بأتعاب محاماة، وكانت المحكمة التي نظرت في القضية"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r2:c0:L2"
  class: "index_wording"
  text: "محل عقد المحاماة هي المحكمة الإدارية؛ فتكون تلك المحكمة هي المختصة"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r2:c0:L3"
  class: "index_wording"
  text: "بنظر النزاع، ولا أثر لشخصية الطرفين في تقرير الاختصاص وتحديده."
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r2:c0:L4"
  class: "ruling_reference"
  text: "(ب/1752/1443)"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c1:L0"
  class: "number"
  text: "151"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c2:L0"
