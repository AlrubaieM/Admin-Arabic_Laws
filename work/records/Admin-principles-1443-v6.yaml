  title_ar: "التنازع السلبي على الاختصاص المكاني"
  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "اختصاص"
    subtopic_label: "ثالثاً/"
    subtopic_title: "الاختصاص المكاني"
  paragraphs:
  - "التنازع السلبي على الاختصاص المكاني لا يقوم إلا في حالة تخلي محكمتين أو أكثر عن الفصل في نزاع معروض عليهما مع اختصاص إحداهما مكانياً بنظره، أما إذا لم تكن إحدى هذه المحاكم مختصة مكانياً بنظر النزاع، وكان الاختصاص منعقداً لمحكمة أخرى لم يعرض عليها النزاع فلا تنشأ حالة التنازع."
  wrap_joins:
  - "page[15]:r2:c0:L2 joined to previous line"
  - "page[15]:r2:c0:L3 joined to previous line"
  - "page[15]:r2:c0:L4 joined to previous line"
  - "page[15]:r2:c0:L5 joined to previous line"
  continues_block: null
- loc: "page[15]:r3"
  kind: "entry"
  numbers:
