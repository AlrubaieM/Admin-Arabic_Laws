  title_ar: "مناط تحقق السلبية فيه توزيع الأراضي البور"
  title_basis: "subtopic_line"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "الأراضي البور"
    subtopic_label: "رابعاً/"
    subtopic_title: "مناط تحقق السلبية فيه توزيع الأراضي البور"
  paragraphs:
  - "يتعين قبل تقرير السلبية في حق الجهة الإدارية عن توزيع الأراضي البور، التحقق من تقدم ذوي الشأن إلى الجهة الإدارية بطلب التوزيع قبل صدور الأمر بإيقاف التوزيع."
  wrap_joins:
  - "page[16]:r3:c0:L2 joined to previous line"
  - "page[16]:r3:c0:L3 joined to previous line"
  continues_block: null
