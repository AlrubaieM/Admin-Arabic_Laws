  title_ar: "سريانه على قرارات التخصيص القديمة والتي لم يصدر بشأنها تمليك"
  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "الأراضي البور"
    subtopic_label: "خامساً/"
    subtopic_title: "منع تمليك الأراضي البور الواقعة في مناطق تطوير حقول الزيت"
  paragraphs:
  - "قرار منع تمليك الأراضي البور الواقعة في مناطق تطوير حقول الزيت إلا بعد موافقة وزارة البترول والثروة المعدنية (وزارة الطاقة)، يسري على من صدر له قرار التخصيص قبل المنع وتأخر بطلب التمليك إلى ما بعد المنع."
  wrap_joins:
  - "page[16]:r4:c0:L3 joined to previous line"
