  class: "title"
  text: "• انعقاد الاختصاص المكاني حال تعدد مكان تنفيذ العقد ولم تتوفر"
  bold: 0.98
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r4:c0:L1"
