    letter_label: "حرف (أ)"
    topic: "الأراضي البور"
    subtopic_label: "ثالثاً/"
    subtopic_title: "سريان إيقاف توزيع الأراضي البور"
  paragraphs:
  - "صدور أمر سامٍ بإيقاف توزيع الأراضي البور لتتمكن وزارة المياه من إنجاز الخطة الوطنية للمياه - تقرير المحكمة الإدارية العليا بأن الأمر السامي يسري بأثره المباشر على جميع طلبات التوزيع التي لم يجر تنفيذها."
  wrap_joins:
  - "page[16]:r2:c0:L2 joined to previous line"
  - "page[16]:r2:c0:L3 joined to previous line"
  continues_block: null
