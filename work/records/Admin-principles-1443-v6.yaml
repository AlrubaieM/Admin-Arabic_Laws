  class: "subtopic_opener"
  text: "أولاً/ الاختصاص الولائي:"
  bold: 1.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r2:c0:L1"
  class: "title"
  text: "• اعتبار الاختصاص الولائي من النظام العام - أسبقية بحثه:"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r2:c0:L2"
  class: "index_wording"
  text: "الاختصاص المتعلق بالولاية القضائية يعد من المسائل الأولية التي يتعين على"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r2:c0:L3"
  class: "index_wording"
  text: "المحكمة بحثها قبل الخوض في موضوع الدعوى؛ باعتبار ذلك من النظام"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r2:c0:L4"
  class: "index_wording"
  text: "العام الذي تبحثه المحكمة من تلقاء نفسها، ولو لم يثره أطراف الدعوى."
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r2:c0:L5"
  class: "ruling_reference"
  text: "(أ/411/1442)"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r3:c1:L0"
  class: "number"
  text: "232"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r3:c2:L0"
