  text: "697"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L0"
  class: "subtopic_opener"
  text: "ثانياً/ عقد المحاماة:"
  bold: 1.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L1"
  class: "title"
  text: "•الاتفاق بين المحامي وموكله على إنهاء القضية - مقتضى وأثر الحكم"
  bold: 0.98
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L2"
  class: "title"
  text: "بعدم قبول الدعوى لرفعها قبل الأوان على عقد المحاماة:"
  bold: 1.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L3"
  class: "index_wording"
  text: "إذا تم الاتفاق بين المحامي وموكله على أتعاب المحاماة في حال كسب القضية"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L4"
  class: "index_wording"
  text: "أو في حال عدم كسبها؛ فإن ذلك يعني أنه أُريد إنهاء القضية المتفق بشأنها"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L5"
  class: "index_wording"
  text: "إما بالمنح أو المنع، وإذا صدر الحكم بعدم قبول الدعوى بتلك القضية لرفعها"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L6"
  class: "index_wording"
  text: "قبل الأوان؛ فإن ذلك يعني أن القضية لا تزال قائمة دون البت في موضوعها،"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L7"
  class: "index_wording"
  text: "وتنتظر أوان السير في موضوعها بطلب يقدم في هذا الشأن، ولا يعني ذلك"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L8"
  class: "index_wording"
  text: "انفساخ عقد الوكالة وإنما يبقى مرتباً لآثاره ما لم يصدر حكم ينال منه."
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[8]:r3:c0:L9"
  class: "ruling_reference"
  text: "(ب/3011/1442)"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
