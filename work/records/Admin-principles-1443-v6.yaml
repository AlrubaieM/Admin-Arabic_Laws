  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r3:c0:L3"
  class: "index_wording"
  text: "واحدة، ولو خالف ذلك قواعد الاختصاص المكاني؛ لئلا يتجزأ نظر النزاع"
