  references:
  - "(ب/3011/1442)"
  title_ar: "الاتفاق بين المحامي وموكله على إنهاء القضية - مقتضى وأثر الحكم بعدم قبول الدعوى لرفعها قبل الأوان على عقد المحاماة"
  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "أتعاب محاماة"
    subtopic_label: "ثانياً/"
    subtopic_title: "عقد المحاماة"
  paragraphs:
  - "إذا تم الاتفاق بين المحامي وموكله على أتعاب المحاماة في حال كسب القضية أو في حال عدم كسبها؛ فإن ذلك يعني أنه أُريد إنهاء القضية المتفق بشأنها إما بالمنح أو المنع، وإذا صدر الحكم بعدم قبول الدعوى بتلك القضية لرفعها قبل الأوان؛ فإن ذلك يعني أن القضية لا تزال قائمة دون البت في موضوعها، وتنتظر أوان السير في موضوعها بطلب يقدم في هذا الشأن، ولا يعني ذلك انفساخ عقد الوكالة وإنما يبقى مرتباً لآثاره ما لم يصدر حكم ينال منه."
  wrap_joins:
  - "page[8]:r3:c0:L4 joined to previous line"
  - "page[8]:r3:c0:L5 joined to previous line"
  - "page[8]:r3:c0:L6 joined to previous line"
  - "page[8]:r3:c0:L7 joined to previous line"
  - "page[8]:r3:c0:L8 joined to previous line"
  continues_block: null
