  text: "1044"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r3:c0:L0"
  class: "index_wording"
  text: "الاختصاص الولائي يعتبر من النظام العام، وبحثه من المسائل الأولية"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r3:c0:L1"
  class: "index_wording"
  text: "السابقة على النظر في شكل الدعوى أو الخوض في موضوعها، وتقضي فيه"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r3:c0:L2"
  class: "index_wording"
  text: "الدائرة ناظرة القضية دون طلب أو دفعٍ من قبل الخصوم؛ باعتبار أن المسائل"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r3:c0:L3"
  class: "index_wording"
  text: "الإجرائية وخاصة ما يتعلق بالنظام العام تُعد من الأمور التي تتصرف فيها"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[9]:r3:c0:L4"
  class: "index_wording"
  text: "جهة القضاء وحدها. (أ/2948/1442)"
