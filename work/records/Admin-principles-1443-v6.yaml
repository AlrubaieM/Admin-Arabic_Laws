  bold: 1.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r4:c0:L2"
  class: "index_wording"
  text: "كون العقد ينفذ في أكثر من منطقة ولا يتعلق بفرع دون آخر، ولا تتوفر لدى"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r4:c0:L3"
  class: "index_wording"
  text: "هذه الفروع المستندات المتعلقة بالعقد في كل أجزائه؛ فإن المحكمة المختصة"
  bold: 0.0
  gap_spaces: 0
  unresolved: 0
- loc: "page[14]:r4:c0:L4"
  class: "index_wording"
