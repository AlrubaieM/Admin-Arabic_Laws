  title_ar: "تشكيل لجنة النظر في منازعات نظام توزيع الأراضي البور"
  title_basis: "subtopic_line"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "الأراضي البور"
    subtopic_label: "ثانياً/"
    subtopic_title: "تشكيل لجنة النظر في منازعات نظام توزيع الأراضي البور"
  paragraphs:
  - "نظام توزيع الأراضي البور لم ينص على تشكيل اللجنة من عدد معين، وإنما سمى جهات معينة - إلغاء إحدى الجهات المسماة في تشكيل اللجنة بضمها إلى جهة أخرى؛ يجعل تشكيل اللجنة من أعضاء بقية الجهات صحيحاً من حيث الأعضاء الواجب توافرهم في اللجنة."
  wrap_joins:
