  references: []
  title_ar: "استحقاق الأجرة المحُددة في عقد المحاماة"
  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "أتعاب محاماة"
    subtopic_label: "أولاً/"
    subtopic_title: "عقد المحاماة"
  paragraphs:
  - "ثبوت عقد المحاماة وتحديد الأجرة فيه لا يعني استحقاق الأجرة في كل الأحوال، وإنما تستحق عند المنازعة فيها عن الجهد المبذول والنتيجة التي تحققت بسببها، وكون هذه الأعمال تتعادل مع الأجرة المحددة مقابل أدائها."
  wrap_joins:
  - "page[8]:r3:c0:L2 joined to previous line"
  - "page[8]:r3:c0:L3 joined to previous line"
  reference_separations: []
  continues_block: null
- loc: "page[8]:r4"
  kind: "entry"
