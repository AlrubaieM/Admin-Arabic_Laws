  references: []
  title_ar: "المتعين على المحكمة حيال المنازعة في أجرة عقد المحاماة"
  title_basis: "bullet_title"
  hierarchy:
    letter: "أ"
    letter_label: "حرف (أ)"
    topic: "أتعاب محاماة"
    subtopic_label: "أولاً/"
    subtopic_title: "عقد المحاماة"
  paragraphs:
  - "إذا كان الموكِل ينازع في صحة عقد المحاماة واشتماله على مبالغة وغبن في الأجرة؛ فإن على المحكمة أن تنظر في هذا النزاع، وتقدر الأتعاب بما يتناسب مع الجهد الذي بذله المحامي، والنفع الذي عاد على الموكِل."
  wrap_joins:
  - "page[8]:r4:c0:L2 joined to previous line"
  - "page[8]:r4:c0:L3 joined to previous line"
  reference_separations: []
  continues_block: null
