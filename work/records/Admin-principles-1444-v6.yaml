    subtopic_title: "عقد المحاماة"
  paragraphs:
  - "تلاقي إرادة أطراف عقد المحاماة على العمل، دون تحديد الأجرة فيه وجعلها جزءاً مشاعاً من العمل، لا ينفي لزومية العقد؛ باعتباره من عقود الإجارة على العمل لا من عقود الجعالة."
  wrap_joins:
  - "page[8]:r2:c0:L3 joined to previous line"
  - "page[8]:r2:c0:L4 joined to previous line"
  reference_separations: []
  continues_block: null
- loc: "page[8]:r3"
