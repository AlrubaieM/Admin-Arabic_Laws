- principle: "205"
  location: "page[11]:r3:c0:L0"
  observed: "• الدعاوى المتعلقة باستبدال منح الأرضي:"
  suspected_reading: "باستبدال منح الأراضي"
  reason: "the see-also text of the same entry (page[11]:r3:c0:L1) writes «منح الأراضي»; 400 dpi crop reviewed on 03/11/2026 confirms the printed «الأرضي»"
  note_ar: "ورد في عنوان المدخل «منح الأرضي» بينما ورد في نص الإحالة نفسه «منح الأراضي»؛ أُثبت العنوان كما طُبع."
- principle: "83"
  location: "page[16]:r3:c0:L0"
  observed: "رابعاً/ مناط تحقق السلبية فيه توزيع الأراضي البور:"
  suspected_reading: "مناط تحقق السلبية في توزيع الأراضي البور"
  reason: "the topic outline (page[15]:r5:c0:L4) writes «في توزيع»; 400 dpi crop reviewed on 03/11/2026 confirms the printed «فيه»"
  note_ar: "ورد في سطر الفرع «السلبية فيه توزيع» بينما ورد في قائمة الموضوع «السلبية في توزيع»؛ أُثبت كلٌّ منهما كما طُبع."
